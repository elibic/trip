<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f0eb" id="tc">
  <meta name="description" content="דנדשמש: מוצרים חדשים עם טיקט שלא התאימו, מתושבי בית שמש. רק דנדש. רק בבית שמש.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>דנדשמש</title>
  <script>
    try {
      var t = localStorage.getItem('nus-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var l = localStorage.getItem('nus-lang') || ((navigator.language || '').indexOf('he') === 0 ? 'he' : (navigator.language || '').indexOf('en') === 0 ? 'en' : 'he');
      document.documentElement.lang = l; document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="shell">
      <a class="logo" href="#feed" aria-label="home">
        <img src="icons/logo.svg" alt="" width="36" height="36">
      </a>
      <div class="brand"><h1 id="brand"></h1><div class="meta" id="tagline"></div></div>
      <nav class="toptabs" id="toptabs" role="tablist"></nav>
      <div class="spacer"></div>
      <button class="iconbtn lang" id="langbtn" aria-label="Language"></button>
      <button class="iconbtn" id="themebtn" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div class="menuwrap">
        <button class="iconbtn" id="menubtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <div class="filters hidden" id="filters"><div class="shell" id="filterbar"></div></div>
  <main class="shell" id="app" role="main"><div class="page narrow"><div class="card"><div class="sk big"></div><div class="sk line"></div></div></div></main>
  <footer class="build" id="build"></footer>

  <nav class="nav" id="nav" role="tablist"></nav>
  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
